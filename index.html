  <meta charset="UTF-8">

  <title>Acessar</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    a {
      padding: 16px 28px;
      background: #0088cc;
      color: #fff;
      text-decoration: none;
      font-size: 18px;
      border-radius: 8px;
    }

    a:active {
      opacity: 0.8;
    }
  </style>

<body>

  <a id="btnTelegram" href="https://apextry.com/go/conta4?utm_source=tiktok&utm_campaign=__CAMPAIGN_NAME__|__CAMPAIGN_ID__&utm_medium=__AID_NAME__|__AID__&utm_content=__CID_NAME__|__CID__&utm_term=__PLACEMENT__&utm_id=__CAMPAIGN_ID__">
    👉 Entrar no Telegram
  </a>

  <script>
    (function () {
      const params = window.location.search;
      if (!params) return;

      const btn = document.getElementById('btnTelegram');
      const baseUrl = btn.getAttribute('href');

      // Evita duplicar ?
      btn.href = baseUrl + (baseUrl.includes('?') ? '&' : '?') + params.substring(1);
    })();
  </script>

</body>
